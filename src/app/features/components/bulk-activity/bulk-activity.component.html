<div class="page-container">
  <div class="data-card">

    <!-- ================= HEADER ================= -->
    <div class="card-header-bar">
      <div class="header-row">

        <div class="header-title-group">
          <div class="header-icon-wrap">
            <i class="fa-solid fa-hard-drive"></i>
          </div>

          <div>
            <h5 class="header-title">Bulk Activity</h5>
          </div>
        </div>

        <!-- COUNT -->
        <div class="span">
          <span class="count-badge">
            {{ filteredList.length ? startValue : 0 }} -
            {{ filteredList.length ? lastValue : 0 }}
            of {{ pagesize.count }} bulk activity
          </span>
        </div>

        <!-- PAGINATION -->
        <div class="header-pagination">
          <pagination-controls
            id="empId"
            (pageChange)="onTablePageChange($event)"
          >
          </pagination-controls>
        </div>

      </div>
    </div>

    <!-- ================= FILTER BAR ================= -->
    <div class="filter-bar">

      <!-- LEFT -->
      <div class="filter-left">

        <!-- ACTION DROPDOWN -->
        <div class="filter-group">

          <label class="filter-label">
            <i class="fa-solid fa-bolt me-1"></i>
            Action
          </label>

          <select
            class="select-styled"
            [(ngModel)]="selectedAction"
          >
            <option value="">Select Action</option>

            <option
              *ngFor="let item of actionOptions"
              [value]="item.value"
            >
              {{ item.label }}
            </option>

          </select>
        </div>

      </div>

      <!-- RIGHT -->
      <div class="filter-right">

        <!-- PAGE SIZE -->
        <div class="filter-group">

          <label class="filter-label">
            ITEMS
          </label>

          <select
            class="select-styled select-sm"
            (change)="onPageSizeChange($event)"
          >

            <option
              *ngFor="let size of [25, 50, 100]"
              [value]="size"
            >
              {{ size }}
            </option>

          </select>
        </div>

        <!-- DOWNLOAD EXCEL -->
        <div class="filter-group btn-group-update">

          <label class="filter-label opacity-0">
            Excel
          </label>

          <button
            class="btn btn-success"
            (click)="downloadExcel()"
            [disabled]="isExcelLoading"
          >
            <i class="fas fa-file-excel me-1"></i>

            {{
              isExcelLoading
                ? 'Downloading...'
                : 'Excel'
            }}

          </button>
        </div>

        <!-- UPLOAD EXCEL -->
        <div class="filter-group btn-group-update">

          <label class="filter-label opacity-0">
            Upload
          </label>

          <input
            type="file"
            #fileInput
            accept=".xlsx,.xls"
            hidden
            (change)="onFileSelected($event)"
          />

          <button
            class="btn btn-primary"
            (click)="fileInput.click()"
          >
            <i class="fa-solid fa-upload me-1"></i>
            Upload Excel
          </button>

        </div>

      </div>
    </div>

    <!-- ================= BODY ================= -->
    <div class="card-body-area">

      <!-- SELECTED COUNT -->
      <div
        class="mb-3"
        *ngIf="selectedDevices.length > 0"
      >
        <button class="btn-action-link">
          Selected: {{ selectedDevices.length }}
        </button>
      </div>

      <!-- ================= TABLE ================= -->
      <div
        class="table-responsive"
        *ngIf="filteredList.length"
      >

        <table class="custom-table">

          <!-- TABLE HEADER -->
          <thead>
            <tr>

              <!-- SELECT ALL -->
              <th>
                <input
                  type="checkbox"
                  [checked]="isAllSelected"
                  (change)="toggleSelectAll($event)"
                />
              </th>

              <!-- DYNAMIC HEADERS -->
              <th *ngFor="let col of tableHeading">
                {{ col.title }}
              </th>

            </tr>
          </thead>

          <!-- TABLE BODY -->
          <tbody>

            <tr
              *ngFor="
                let data of filteredList
                  | paginate
                    : {
                        id: 'empId',
                        itemsPerPage: pagesize.limit,
                        currentPage: pagesize.offset,
                        totalItems: pagesize.count,
                      };
                let i = index
              "
            >

              <!-- CHECKBOX -->
              <td>
                <input
                  type="checkbox"
                  [checked]="isChecked(data)"
                  (change)="onCheckboxChange($event, data)"
                />
              </td>

              <!-- S NO -->
              <td>
                <span class="sno-badge">
                  {{
                    (pagesize.offset - 1)
                      * pagesize.limit
                      + i
                      + 1
                  }}
                </span>
              </td>

              <!-- DEVICE ID -->
              <!-- <td>
                <span>
                  {{ data.deviceId }}
                </span>
              </td> -->

              <!-- DEVICE FULL NAME -->
              <td>
                {{ data.deviceFName }}
              </td>

              <!-- DEVICE SHORT NAME -->
              <!-- <td>
                {{ data.deviceSName }}
              </td> -->

              <!-- DEVICE DIRECTION -->
              <!-- <td>
                {{
                  data.deviceDirection || "-"
                }}
              </td> -->

              <!-- SERIAL NUMBER -->
              <!-- <td>
                {{
                  data.serialNumber || "-"
                }}
              </td> -->

              <!-- CONNECTION TYPE -->
              <!-- <td>

                <span
                  class="conn-badge"
                  [class.conn-wired]="
                    data.connectionType === 'Wired'
                  "
                  [class.conn-wireless]="
                    data.connectionType !== 'Wired'
                  "
                >
                  {{
                    data.connectionType || "-"
                  }}
                </span>

              </td> -->

              <!-- IP ADDRESS -->
              <!-- <td>
                {{
                  data.ipAddress || "-"
                }}
              </td> -->

              <!-- LAST LOG DOWNLOAD -->
              <!-- <td>
                {{
                  data.lastLogDownloadDate || "-"
                }}
              </td> -->

            </tr>

          </tbody>
        </table>
      </div>

      <!-- ================= NO DATA ================= -->
      <div
        class="no-data-msg"
        *ngIf="!filteredList.length"
      >

        <div class="no-data-icon">
          <i class="fa-solid fa-inbox"></i>
        </div>

        No devices found

      </div>

    </div>
  </div>
</div>
